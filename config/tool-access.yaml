version: 0.3.0
purpose: Define when external tools and connectors may be used by workflows and roles.

principles:
  - Prefer repository-local instructions before plugin defaults.
  - Use external tools only when the workflow stage and approval allow it.
  - Do not create external side effects unless the user explicitly asks or approval permits it.
  - Record tool results in the final artifact or handoff.

tools:
  web_search:
    integration_doc: integrations/web-search.md
    purpose: Current market, competitor, regulatory, platform, pricing, SEO, or documentation evidence.
    allowed_workflows:
      - workflows/idea-to-discovery.md
      - workflows/discovery-to-prd.md
      - workflows/release-to-growth.md
    default_mode: read_only
    side_effects_allowed: false
    output_required:
      - Source links
      - Evidence summary
      - Fact vs assumption separation
      - Confidence level

  github:
    integration_doc: integrations/github.md
    purpose: Read/write repository files, inspect PRs/issues, create branches/PRs, and preserve delivery traceability.
    allowed_workflows:
      - workflows/backlog-to-development.md
      - workflows/development-to-qa.md
      - workflows/qa-to-release.md
    read_allowed_without_explicit_approval: true
    write_requires:
      - Explicit user request or workflow approval
      - Target repository
      - Repository AGENTS.md review
      - Scope tied to ticket or artifact
    destructive_actions_require_explicit_user_approval: true
    output_required:
      - Repository
      - Files changed
      - Commit/branch/PR reference when created
      - Verification result

  jira:
    integration_doc: integrations/jira.md
    purpose: Search, draft, create, update, link, and comment on Jira issues.
    allowed_workflows:
      - workflows/architecture-to-backlog.md
      - workflows/development-to-qa.md
      - workflows/qa-to-release.md
    read_allowed_without_explicit_approval: true
    write_requires:
      - Explicit user request or APPROVED_FOR_BACKLOG
      - Project key
      - Issue type
      - Summary and acceptance criteria
    output_required:
      - Issue key
      - Parent/child links
      - Dependencies
      - Status

  figma:
    integration_doc: integrations/figma.md
    purpose: Read or create product design artifacts when UI/UX work requires visual design context.
    allowed_workflows:
      - workflows/prd-to-design.md
      - workflows/prd-to-architecture.md
      - workflows/backlog-to-development.md
    read_allowed_without_explicit_approval: true
    write_requires:
      - Explicit user request
      - Design scope
      - Target file or project
    output_required:
      - Figma file or frame link
      - Design context summary
      - Handoff notes

  release_systems:
    integration_doc: integrations/release.md
    purpose: Deployment, release creation, store distribution, monitoring, and rollback.
    allowed_workflows:
      - workflows/qa-to-release.md
    write_requires:
      - APPROVED_FOR_RELEASE
      - Explicit user request for execution
      - QA evidence
      - Rollback plan
      - Release owner
    output_required:
      - Release/deployment reference
      - Monitoring plan
      - Rollback status

side_effect_policy:
  read_only_allowed_when:
    - Workflow requires external context
    - User asks for inspection or research
    - No external state is changed
  write_allowed_when:
    - User explicitly requests the action
    - Approval state permits the action
    - Required inputs are present
    - Integration doc rules are satisfied
  always_stop_for:
    - Destructive actions without explicit approval
    - Missing target system or repository/project
    - Missing approval for side effects
    - Missing credentials or insufficient permissions
